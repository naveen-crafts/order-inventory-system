services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
    ports:
      - "1433:1433"
  api:
    build: ./api
    depends_on:
      - db
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=OrderInventory;User Id=sa;Password=Your_strong_Passw0rd;TrustServerCertificate=True"
    ports:
      - "5000:8080"
